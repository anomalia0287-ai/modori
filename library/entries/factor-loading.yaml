summary_en: "A value indicating how strongly an item or variable relates to a component or factor."
interpretation_ko: "절댓값이 클수록 변수와 해당 차원의 관련성이 크며, 부호는 차원 점수의 방향에 따라 해석합니다."
interpretation_en: "Larger absolute values indicate stronger association between the variable and the dimension; the sign is interpreted relative to the dimension-score direction."
