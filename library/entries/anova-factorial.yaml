    locator: "Section 1.3.5.5"
    verified: true
  - citation: "SAS Institute. PROC GLM for Unbalanced ANOVA. SAS/STAT User's Guide."
    locator: "PROC GLM: Unbalanced ANOVA"
    verified: true
