slug: welch-t-test
kind: method
title_ko: "Welch 독립표본 t검정"
title_en: "Welch's independent-samples t-test"
summary_ko: "서로 다른 두 집단의 평균 점수가 실제로 차이 나는지 확인하는 방법이에요. 두 집단에서 점수가 퍼진 정도가 서로 달라도 결과를 믿을 수 있도록 보정해 줍니다."
summary_en: "A way to check whether two separate groups really differ in their average score. It adjusts the result so it stays trustworthy even when the two groups' scores are spread out by different amounts."
interpretation_ko: "p값이 .05보다 작으면 두 집단의 평균 차이를 우연으로 보기 어렵다는 뜻입니다. 차이가 '얼마나 큰지'는 Cohen's d로 함께 확인하세요."
interpretation_en: "A p-value below .05 means the difference in group means is unlikely to be due to chance alone. Read how large the difference is from Cohen's d alongside it."
when_to_use_ko: "서로 다른 두 집단(예: 처치군 vs 대조군)의 연속 점수 평균을 비교할 때. 특히 두 집단의 분산이 같다고 보기 어려울 때 기본으로 권장됩니다."
when_to_use_en: "When comparing the mean of a continuous score between two independent groups (e.g., treatment vs control), especially when equal variances cannot be assumed — it is a safe default."
how_to_report_ko: "예: \"t(33.12) = 2.45, p = .020, Cohen's d = 0.62\" 형식으로 보고합니다. Welch 보정에서는 자유도(df)가 소수로 나옵니다."
how_to_report_en: "Report as, e.g., \"t(33.12) = 2.45, p = .020, Cohen's d = 0.62\". With Welch's correction the degrees of freedom (df) are fractional."
pitfalls_ko: "표본이 작고 정규성이 심하게 깨진 경우에는 Mann-Whitney U 검정을 고려하세요. 한 사람을 두 번 측정한 '대응' 자료에는 쓰지 않습니다(그때는 대응표본 t검정)."
pitfalls_en: "With small and strongly non-normal samples, consider the Mann-Whitney U test. Do not use it for paired/repeated measurements of the same person (use a paired-samples t-test instead)."
assumptions:
  - independence-of-errors
  - normality
alternatives:
  - student-t-test
  - mann-whitney-u
related:
  - cohens-d
  - p-value
  - homogeneity-of-variance
references:
