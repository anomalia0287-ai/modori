slug: repeated-measures-anova
kind: method
title_ko: "반복측정 분산분석"
title_en: "Repeated-measures ANOVA"
summary_ko: "같은 참여자에게서 세 개 이상 시점이나 조건의 평균 차이를 검정하는 분석입니다."
summary_en: "A method for comparing means across three or more repeated levels from the same participants."
interpretation_ko: null
interpretation_en: null
when_to_use_ko: "한 행이 한 참여자이고 반복 조건이 여러 열로 저장된 wide-format 자료에서 사용합니다."
when_to_use_en: "Use it for wide-format repeated measures where one row is one participant and repeated levels are columns."
