<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">Modori OpenAI Build Week evidence card</title>
  <desc id="desc">A high-contrast card separating the existing project from five eligible Build Week extension groups and stating that GPT-5.6 is build-time only.</desc>
  <rect width="1920" height="1080" fill="#f8f4ea"/>
  <rect x="0" y="0" width="36" height="1080" fill="#1f5c55"/>
  <circle cx="1684" cy="166" r="180" fill="#d9ebe5"/>
  <circle cx="1772" cy="84" r="88" fill="#c5a56a" opacity="0.28"/>

  <g font-family="Segoe UI, Arial, sans-serif" fill="#17302d">
    <text x="126" y="142" font-size="34" font-weight="650" letter-spacing="2">MODORI · OPENAI BUILD WEEK</text>
    <text x="126" y="232" font-size="68" font-weight="750">Eligible extension evidence</text>

    <rect x="126" y="292" width="1668" height="132" rx="24" fill="#17302d"/>
    <text x="172" y="348" font-size="29" font-weight="700" fill="#f8f4ea">EXISTING PROJECT</text>
    <text x="172" y="393" font-size="27" fill="#d9ebe5">Official cutoff · 2026-07-13 09:00 PT</text>

    <text x="126" y="500" font-size="28" font-weight="700" fill="#1f5c55">BUILT WITH CODEX + GPT-5.6</text>

    <g font-size="32" font-weight="570">
      <circle cx="150" cy="564" r="8" fill="#c08342"/>
      <text x="180" y="576">Revised Windows research surface</text>
      <circle cx="150" cy="636" r="8" fill="#c08342"/>
      <text x="180" y="648">Bounded deterministic clarification</text>
      <circle cx="150" cy="708" r="8" fill="#c08342"/>
      <text x="180" y="720">AnalysisPassport v2 authority</text>
      <circle cx="150" cy="780" r="8" fill="#c08342"/>
      <text x="180" y="792">Durable local multi-round flow</text>
      <circle cx="150" cy="852" r="8" fill="#c08342"/>
      <text x="180" y="864">Release integration and verification hardening</text>
    </g>

    <line x1="1120" y1="518" x2="1120" y2="884" stroke="#b8c9c3" stroke-width="2"/>
    <text x="1180" y="592" font-size="34" font-weight="720">Build time,</text>
    <text x="1180" y="638" font-size="34" font-weight="720">not runtime</text>
    <text x="1180" y="704" font-size="25" fill="#365d58">GPT-5.6 is not a Modori</text>
    <text x="1180" y="740" font-size="25" fill="#365d58">runtime dependency.</text>
    <text x="1180" y="814" font-size="25" fill="#365d58">Owner retained product</text>
    <text x="1180" y="850" font-size="25" fill="#365d58">and release decisions.</text>

    <text x="126" y="1004" font-size="23" fill="#5a6c68">Repository history and the /feedback Session ID provide the auditable trail.</text>
  </g>
</svg>
